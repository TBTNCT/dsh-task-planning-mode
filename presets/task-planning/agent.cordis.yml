# 「任务规划」模式（agent preset）· 最小骨架版
#
# 本文件是 AGENT-PLANE 组合清单：顶层必须是数组，每一行是一个带非空 name 的 map。
# 本任务（任务 01）只挂"最必要的行"：身份（persona）+ 三个工具 + 压缩组。
# 完整工具集见任务 02，token 估算器见任务 03，正式系统提示词见任务 04。
#
# 硬性约束提醒：
#   * 不写 complete: true —— 否则 DSH 的工具指引与运行上下文全部丢失。
#   * 服务类行必须放在带 isolate 的 group 里；本文件除压缩组外不自创 isolate。
#   * 官方安装目录（<DSH_INSTALL>\...）只读，本文件是用户层副本的唯一来源。

# ── identity ────────────────────────────────────────────────────────────────

# 本模式自己的 persona：prefix 目前是占位文本，正式系统提示词在任务 04 写入。
# {{model}} / {{cwd}} 由 agent 自己的路由与工作目录解析；不设 complete（要保持
# DSH 的工具指引与运行上下文）。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      你是 DeepSeek Harness 的「任务规划」模式：把使用者的想法问清楚，拆成可执行的规划与提示词，
      自己不动手实现任何东西。
      （正式系统提示词见任务 04）
    suffix: Your working directory is {{cwd}}.

# ── tools ───────────────────────────────────────────────────────────────────

# 模式必须会向使用者提问。
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# 文件读写编辑：read / write / edit。注册进宿主 tools 注册表，自己不提供服务，无需 realm。
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

# 文件检索：glob / grep。
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'

# ── compaction ──────────────────────────────────────────────────────────────

# 规划对话很长，必须有压缩。
# compaction-basic 会通过 ctx.get 读取 toolResultPrune，因此裁剪器必须与它共享
# 同一个 realm（isolate 里的 toolResultPruner），不能放在组外。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024