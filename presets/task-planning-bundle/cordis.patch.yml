# 「任务规划」模式 · DSH bundle 补丁（新版声明式 preset 机制，适用 DSH 0.2.x）
#
# 本文件把「任务规划」注册成一个 agent preset：
#   插入一行 `@deepseek-ai/dsh-agent-preset`，它的 config 就是 preset 本体
#   （id / name / description / order / plugins）；子插件行写在 config.plugins 里。
#
# 安装方式（人工，在桌面端 UI 里做，详见同目录 README.md）：
#   桌面端侧栏「插件」→「添加插件」→ 粘贴本目录绝对路径 →「安装」→「立即启用」
#
# 机制提醒（来源：本机运行的 dsh-agent-preset-registry / dsh-agent-preset 的 README 与源码）：
#   * registry 不扫描任何目录，也不接受 preset 路径 —— 旧机制的
#     `.agent-presets\<id>\agent.cordis.yml` 在 0.2.x 上是死数据。
#   * `config.plugins` 里每一行仍是普通 Cordis 插件行（含 `!!js`、`group`、`isolate`）。
#   * preset 里提供服务的行与其消费方必须共享同一个 `cordis:group` 隔离 realm。
#
# 任务 02（工具集接线与实测）落定后的行集 = 用户已确认的**标准档**：
#   提问 + 读写文件 + 文本检索 + 联网 + 任务板 + 执行命令（含后台任务）+ skills +
#   指令文件 + 上下文压缩 + 交付物展示。
# **不含**：子代理 / Agent Teams / 工作流 / 计划模式 / 目标 / 自我修改（tool-cordis）。
# 行序与打包版 `dsh-web-app/presets/standard.patch.yml`（0.2.1-alpha.1）保持一致，
# 便于日后逐行对照；权威清单取法见 `docs/调研/03-preset机制-新版.md` 第 0 节。
#
# 每行的 config 必填字段都按**目标版本**各包 `lib/index.js` 里的
# `Config = z.object({…})` 核对过（0.2.x 把若干旧版可选项改成了必填，见任务 01 的
# `tool-fs-search` 事故）；改完必跑校验：
#   E:\node.exe %TEMP%\dsh-tp-01\validate-bundle.cjs

- insert:
    # 行 id（`preset-task-planning`）是 Loader 的编辑地址，用于按 id 写覆盖补丁；
    # config.id（`task-planning`）才是会话保存与选择器内部使用的 preset 标识符。
    - id: preset-task-planning
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: task-planning
        name: 任务规划
        description: 把模糊想法问清楚并拆成可执行的规划与提示词，自己不动手实现。
        order: 5
        plugins:
          # ── identity ──────────────────────────────────────────────────────
          # prefix 目前是占位文本，正式系统提示词在任务 04 写入。
          # 不设 complete（否则会丢掉 DSH 的工具指引与运行上下文）。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                你是 DeepSeek Harness 的「任务规划」模式：把使用者的想法问清楚，拆成可执行的规划与提示词，
                自己不动手实现任何东西。
                （正式系统提示词见任务 04）
              suffix: Your working directory is {{cwd}}.

          # ── 指令文件 ──────────────────────────────────────────────────────
          # 让模式能读到项目里的 AGENTS.md 类指引；maxBytes 与官方 standard 一致。
          # 规划者要先看懂项目约定才谈得上"拆得对"。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── 运行上下文 ────────────────────────────────────────────────────
          # 注入当前日期时间：规划文档要写日期与"版本适用性"标注，
          # 缺了它模型不知道"今天"是几号。官方 standard 也挂这一行。
          # （任务 02 由人工裁定加挂，见 docs/实施记录/02-工具实测表.md）
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell：按平台二选一（与官方 standard 逐字一致）─────────────────
          # Windows 上 tool-bash 被 disabled，非 Windows 上 tool-pwsh 被 disabled。
          # 用途：环境检测、只读查询、按镜像下载工具。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── 文件读写编辑 ──────────────────────────────────────────────────
          # read / write / edit。注册进宿主 tools 注册表，自己不提供服务，无需 realm。
          # 规划模式要靠写文件交付规划文档。注意：写盘失败要如实报告，不许"绕路"改验收。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          # ── 文件检索 ──────────────────────────────────────────────────────
          # glob / grep：先摸清项目结构再提问，是"问对问题"的前提。
          # 注意：0.2.x 起 `sampleOverCapGlobResults` 是**必填**（z.boolean().required()），
          # 缺了会让整个 preset「加载失败」→ 模式选择器里看不到它（实测：任务 01 第一版就踩了这个坑）。
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── 后台任务 ──────────────────────────────────────────────────────
          # 长命令（环境检测、下载）放后台，规划对话不被阻塞；需要取回输出。
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ────────────────────────────────────────────────────────
          # skill-filesystem 提供 skill 来源，tool-skill 让模式能加载 skill；
          # 任务 05 的文档模板将以 skill 形式随包分发。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── compaction（服务类，必须共享 isolate realm）────────────────────
          # 规划对话很长，必须有压缩。compaction-basic 会通过 ctx.get 读取
          # toolResultPrune，因此裁剪器必须与它共享同一个 realm（isolate），
          # 不能放到组外；三个阈值与官方 standard 逐字一致。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── 提问 ──────────────────────────────────────────────────────────
          # 本模式的核心动作：把模糊需求问清楚。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # ── 任务板 ────────────────────────────────────────────────────────
          # 规划产出的"步骤清单"要在会话内可见、可勾选；
          # allowParallelInProgress 与官方 standard 一致（规划里常有并行步骤）。
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # ── 联网 ──────────────────────────────────────────────────────────
          # 查资料、核对版本与官方文档；fetch + search 都要开。
          # 搜索提供方属宿主平面，preset 管不了；不可用时如实记进实测表。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── 交付物 ────────────────────────────────────────────────────────
          # 规划模式"不实现"，产出物必须能被单独打开查看：present 用来把文件列为交付物。
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
